{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GUIOS PRO{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'presentation/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'presentation/css/guia.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}guios-body{% endblock %}">
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
    <script src="{% static 'presentation/js/guia.js' %}" defer></script>
</body>
</html>
