<header class="app-topbar" role="banner">
    <!-- Subtítulo FLOSS a la izquierda -->
    <div class="topbar-left">
        <span class="system-context-text">Sistema de apoyo a la decisión · Adopción de FLOSS</span>
    </div>

    <!-- Identidad de sesión a la derecha (el middleware garantiza que hay sesión) -->
    <div class="topbar-right">
        <span class="user-display-name">{{ request.user.get_full_name }}</span>
        <span class="user-role-badge">{{ request.user.get_rol_display }}</span>
        <form method="post" action="{% url 'presentation:logout' %}" class="topbar-logout-form">
            {% csrf_token %}
            <button type="submit" class="topbar-logout-link" title="Cerrar sesión">
                <svg class="logout-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Cerrar sesión</span>
            </button>
        </form>
    </div>
</header>
