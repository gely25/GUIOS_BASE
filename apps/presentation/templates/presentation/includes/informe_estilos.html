{% comment %}Estilos compartidos por Resultados e Informe (HU14). Se incluye dentro de extra_head.{% endcomment %}
<style>
/* El CSS global pone overflow-x:hidden en html y body; eso rompe el sticky del menú lateral. */
body.guios-body { overflow-x: visible; }
.informe-pagina .admin-panel-card { margin-bottom: 20px; }
.informe-pagina .admin-panel-title { margin-bottom: 4px; }
.informe-pagina .btn-top-action { text-decoration: none; }
.informe-pagina .btn-secundario { background: #fff; color: #1f2426; border: 1px solid #cbd5e1; }
.informe-acciones { display: flex; gap: 12px; flex-wrap: wrap; }
.informe-vacio { text-align: center; padding: 32px 16px; color: #475569; }
.informe-vacio h2 { margin: 0 0 8px; color: #1f2426; }
.informe-recomendacion { border-left: 4px solid #0f766e; background: #f0fdfa; padding: 14px 18px; border-radius: 8px; line-height: 1.55; }
.informe-explicacion { line-height: 1.6; color: #334155; }
.informe-nota { margin: 12px 0 0; font-size: 12px; color: #64748b; }
.inf-table td.num, .inf-table th.num { text-align: center; font-variant-numeric: tabular-nums; }
.inf-table tbody tr:nth-child(even) { background-color: #f8fafc; }
.inf-table td { padding: 12px 16px; }
.inf-table td.factor { font-weight: 600; color: #1f2426; }
.inf-table td.sub { color: #64748b; font-size: 13px; }
.inf-datos { display: grid; grid-template-columns: max-content 1fr; gap: 8px 24px; margin: 0; }
.inf-datos dt { font-weight: 600; color: #1f2426; }
.inf-datos dd { margin: 0; color: #334155; overflow-wrap: anywhere; }
.foda { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #e2e8f0; color: #334155; }
.foda--Fortaleza { background: #dcfce7; color: #166534; }
.foda--Oportunidad { background: #dbeafe; color: #1e40af; }
.foda--Debilidad { background: #fef9c3; color: #854d0e; }
.foda--Amenaza { background: #fee2e2; color: #991b1b; }
.inf-factor { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; background: #fff; }
.inf-factor > summary { cursor: pointer; padding: 12px 16px; font-weight: 600; color: #1f2426; }
.inf-factor-cuerpo { padding: 0 16px 14px; }
.inf-valoracion { padding: 10px 0; border-top: 1px solid #e2e8f0; }
.inf-valoracion:first-child { border-top: none; }
.inf-valores { font-size: 13px; color: #475569; margin: 2px 0 6px; }
.inf-justificacion { font-size: 13px; color: #334155; margin: 4px 0; }
.inf-evidencia { margin: 6px 0 0 14px; padding-left: 10px; border-left: 3px solid #cbd5e1; font-size: 13px; color: #334155; }
.inf-evidencia small { color: #64748b; }
</style>
