<aside class="app-sidebar" aria-label="Navegación lateral principal">
    <!-- Logotipo institucional -->
    <div class="sidebar-brand-container">
        <a href="{{ menu_inicio_url }}" class="sidebar-brand-link" aria-label="GUIOS PRO Inicio">
            <span class="brand-text-guios">GUIOS</span> <span class="brand-text-pro">PRO</span>
        </a>
    </div>

    <!-- Menú del rol (se dibuja desde el catálogo de business_rules.menu) -->
    <div class="sidebar-content">
        <div class="sidebar-section-label">{{ menu_seccion }}</div>
        <nav class="sidebar-nav">
            <ul class="sidebar-menu-list">
                {% for item in menu_items %}
                <li class="sidebar-menu-item">
                    <a href="{{ item.url }}" class="sidebar-link{% if item.activo %} active{% endif %}"{% if item.activo %} aria-current="page"{% endif %}>
                        {% include "presentation/includes/icono_menu.html" with icono=item.icono %}
                        <span>{{ item.etiqueta }}</span>
                    </a>
                </li>
                {% endfor %}
            </ul>
        </nav>
    </div>

    <!-- Pie del sidebar -->
    <div class="sidebar-footer">
        <a href="#guia" class="sidebar-footer-link" title="Guía metodológica GUIOS">
            <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>Guía metodológica</span>
        </a>
    </div>
</aside>
