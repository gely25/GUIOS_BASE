<aside class="app-sidebar" aria-label="Navegación lateral principal">
    <!-- Logotipo Institucional Superior -->
    <div class="sidebar-brand-container">
        <a href="{% if current_area == 'administracion' %}{% url 'presentation:admin-inicio' %}{% else %}{% url 'presentation:decisor-inicio' %}{% endif %}" class="sidebar-brand-link" aria-label="GUIOS PRO Inicio">
            <span class="brand-text-guios">GUIOS</span> <span class="brand-text-pro">PRO</span>
        </a>
    </div>

    <!-- Navegación del Área -->
    <div class="sidebar-content">
        {% if current_area == 'administracion' %}
            <!-- Área de Administración -->
            <div class="sidebar-section-label">ADMINISTRACIÓN</div>
            <nav class="sidebar-nav">
                <ul class="sidebar-menu-list">
                    <li class="sidebar-menu-item">
                        <a href="{% url 'presentation:admin-usuarios-roles' %}" class="sidebar-link {% if active_item == 'usuarios-y-roles' or active_item == 'usuarios-roles' or active_item == 'inicio' %}active{% endif %}">
                            <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            <span>Usuarios y roles</span>
                        </a>
                    </li>
                    <li class="sidebar-menu-item">
                        <a href="{% url 'presentation:admin-actualizacion-bibliografica' %}" class="sidebar-link {% if active_item == 'actualización-bibliográfica' or active_item == 'actualizacion-bibliografica' %}active{% endif %}">
                            <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                            </svg>
                            <span>Actualización bibliográfica</span>
                        </a>
                    </li>
                    <li class="sidebar-menu-item">
                        <a href="{% url 'presentation:admin-catalogo-metodologico' %}" class="sidebar-link {% if active_item == 'catálogo-metodológico' or active_item == 'catalogo-metodologico' %}active{% endif %}">
                            <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="21 8 21 21 3 21 3 8"></polyline>
                                <rect x="1" y="3" width="22" height="5"></rect>
                                <line x1="10" y1="12" x2="14" y2="12"></line>
                            </svg>
                            <span>Catálogo metodológico</span>
                        </a>
                    </li>
                </ul>
            </nav>
        {% else %}
            <!-- Área del Decisor -->
            <div class="sidebar-section-label">ESPACIO DEL DECISOR</div>
            <nav class="sidebar-nav">
                <ul class="sidebar-menu-list">
                    <li class="sidebar-menu-item">
                        <a href="{% url 'presentation:decisor-inicio' %}" class="sidebar-link {% if active_item == 'inicio' %}active{% endif %}">
                            <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="14" y="14" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                            </svg>
                            <span>Inicio</span>
                        </a>
                    </li>
                    <li class="sidebar-menu-item">
                        <a href="{% url 'presentation:decisor-ficha-inicial' %}" class="sidebar-link {% if active_item == 'ficha-inicial-de-evaluación' or active_item == 'ficha-inicial' %}active{% endif %}">
                            <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="16"></line>
                                <line x1="8" y1="12" x2="16" y2="12"></line>
                            </svg>
                            <span>Nueva evaluación</span>
                        </a>
                    </li>
                    <li class="sidebar-menu-item">
                        <a href="{% url 'presentation:decisor-historial-evaluaciones' %}" class="sidebar-link {% if active_item == 'historial-de-evaluaciones' or active_item == 'historial-evaluaciones' %}active{% endif %}">
                            <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 14 14"></polyline>
                            </svg>
                            <span>Historial de evaluaciones</span>
                        </a>
                    </li>
                </ul>
            </nav>
        {% endif %}
    </div>

    <!-- Pie del Sidebar: Guía Metodológica y Conmutador de Área -->
    <div class="sidebar-footer">
        <a href="#guia" class="sidebar-footer-link" title="Guía metodológica GUIOS">
            <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>Guía metodológica</span>
        </a>

    </div>
</aside>
